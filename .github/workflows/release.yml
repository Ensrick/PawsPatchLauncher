name: Publish launcher

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      request_signing:
        description: Request production signing (requires approved SignPath project)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: write
      actions: read
    env:
      SIGNING_REQUIRED: ${{ vars.SIGNPATH_ENABLED == 'true' || inputs.request_signing == true }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 8.0.x
      - name: Check release identity and signing configuration
        id: identity
        shell: pwsh
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          SIGNPATH_SIGNING_POLICY_SLUG: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          SIGNPATH_ARTIFACT_CONFIGURATION_SLUG: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          SIGNPATH_EXPECTED_PUBLISHER: ${{ vars.SIGNPATH_EXPECTED_PUBLISHER }}
        run: |
          $ErrorActionPreference = 'Stop'
          [xml]$project = Get-Content src/PawsPatchLauncher/PawsPatchLauncher.csproj -Raw
          $version = [string]$project.Project.PropertyGroup.Version
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Expected a numeric launcher version.' }
          if ($env:GITHUB_EVENT_NAME -eq 'push' -and $env:GITHUB_REF_NAME -cne "v$version") {
            throw 'Tag does not match the launcher source version.'
          }
          if ($env:SIGNING_REQUIRED -eq 'true') {
            foreach ($name in @('SIGNPATH_API_TOKEN', 'SIGNPATH_ORGANIZATION_ID', 'SIGNPATH_PROJECT_SLUG',
              'SIGNPATH_SIGNING_POLICY_SLUG', 'SIGNPATH_ARTIFACT_CONFIGURATION_SLUG', 'SIGNPATH_EXPECTED_PUBLISHER')) {
              if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
                throw "Required signing setting is missing: $name"
              }
            }
          } else {
            Write-Warning 'Unsigned build. SignPath is not enabled; SmartScreen warnings may remain.'
          }
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Test
        run: dotnet run --project tests/PawsPatchLauncher.Tests/PawsPatchLauncher.Tests.csproj -c Release
      - name: Publish autonomous Windows build
        shell: pwsh
        run: |
          dotnet publish src/PawsPatchLauncher/PawsPatchLauncher.csproj `
            -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:PublishReadyToRun=false -p:IncludeSourceRevisionInInformationalVersion=false `
            -o artifacts/unsigned
          if ($LASTEXITCODE -ne 0) { throw 'Launcher publish failed.' }
      - name: Test packaging and unsigned rejection
        shell: pwsh
        run: ./tools/TestLauncherSigning.ps1 -BuildDirectory artifacts/unsigned -WorkDirectory artifacts/signing-tests
      - name: Upload launcher for origin-verified signing
        if: env.SIGNING_REQUIRED == 'true'
        id: unsigned
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unsigned-launcher
          path: artifacts/unsigned/PawsPatchLauncher.exe
          if-no-files-found: error
          retention-days: 7
      - name: Request SignPath signature
        if: env.SIGNING_REQUIRED == 'true'
        uses: signpath/github-action-submit-signing-request@c92b958760219087e01f8d67a1669ed57afe2627 # v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 1800
          output-artifact-directory: artifacts/signed
          parameters: |
            version: ${{ toJSON(steps.identity.outputs.version) }}
      - name: Verify and package final executable
        shell: pwsh
        env:
          EXPECTED_PUBLISHER: ${{ vars.SIGNPATH_EXPECTED_PUBLISHER }}
          LAUNCHER_VERSION: ${{ steps.identity.outputs.version }}
        run: |
          $parameters = @{
            BuildDirectory = 'artifacts/unsigned'
            OutputDirectory = 'artifacts/distribution'
            Version = $env:LAUNCHER_VERSION
            SourceCommit = $env:GITHUB_SHA
            RequireSignature = ($env:SIGNING_REQUIRED -eq 'true')
          }
          if ($parameters.RequireSignature) {
            $parameters.SignedDirectory = 'artifacts/signed'
            $parameters.ExpectedPublisher = $env:EXPECTED_PUBLISHER
          }
          ./tools/CompleteLauncherArtifact.ps1 @parameters
      - name: Save verified distribution artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: launcher-distribution
          path: artifacts/distribution/*
          if-no-files-found: error
          retention-days: 14
      - name: Create GitHub release
        if: github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = "docs/release-$($env:GITHUB_REF_NAME.Substring(1)).md"
          if (!(Test-Path -LiteralPath $notes)) { throw 'Release notes are missing.' }
          $noteText = (Get-Content -LiteralPath $notes -Raw) + "`n`nCode signing policy: https://github.com/$env:GITHUB_REPOSITORY/blob/main/docs/CODE_SIGNING.md`n"
          $noteText | Set-Content artifacts/release-notes.md -Encoding utf8NoBOM
          python tools/PublishLauncherRelease.py "$($env:GITHUB_REF_NAME.Substring(1))" "$env:GITHUB_SHA" `
            artifacts/release-notes.md `
            artifacts/distribution/PawsPatchLauncher.exe `
            "artifacts/distribution/PawsPatchLauncher-$env:GITHUB_REF_NAME-win-x64.zip" `
            artifacts/distribution/launcher-artifact.json `
            --name "Paw's Launcher $env:GITHUB_REF_NAME"
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed.' }
